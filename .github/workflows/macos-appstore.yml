name: Repair macOS GitHub release archive

on:
  workflow_dispatch:

permissions:
  contents: write
  actions: read

env:
  GH_TOKEN: ${{ github.token }}
  GH_REPO: ${{ github.repository }}

jobs:
  repair-desktop:
    runs-on: macos-15-intel
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
      - name: Download the original release archive
        run: |
          set -euo pipefail
          [ "$(gh api "repos/$GH_REPO/actions/runs/40375540711" --jq .head_sha)" = c43ebdaee8eee38a8c455d026be72c2c6aac3d57 ]
          gh run download 40375540711 -n macos-app -D package
          mkdir -p "$RUNNER_TEMP/desktop" "$RUNNER_TEMP/smoke"
          tar -xzf package/CrispChess-macos.tar.gz -C "$RUNNER_TEMP/desktop"
          python3 tools/verify_macos_app.py "$RUNNER_TEMP/desktop/CrispChess.app"
      - name: Repair the desktop signature
        run: |
          set -euo pipefail
          app="$RUNNER_TEMP/desktop/CrispChess.app"
          codesign --display --entitlements :- "$app" > "$RUNNER_TEMP/smoke/entitlements-before.plist"
          bash tool/sign_macos_adhoc.sh "$app"
          codesign --display --entitlements :- "$app" > "$RUNNER_TEMP/smoke/entitlements-after.plist"
          python3 - "$RUNNER_TEMP/smoke/entitlements-after.plist" <<'PY'
          import plistlib, sys
          with open(sys.argv[1], 'rb') as source:
              values = plistlib.load(source)
          assert values == {
              'com.apple.security.app-sandbox': True,
              'com.apple.security.device.audio-input': True,
              'com.apple.security.network.client': True,
          }, values
          print('Desktop sandbox, microphone, and network entitlements verified')
          PY
          codesign --verify --deep --strict "$app"
          nm -gU "$app/Contents/Frameworks/libcrispasr.dylib" | grep crispasr_session_score_texts
      - name: Launch the repaired desktop app
        run: |
          set -euo pipefail
          "$RUNNER_TEMP/desktop/CrispChess.app/Contents/MacOS/CrispChess" > "$RUNNER_TEMP/smoke/app.log" 2>&1 &
          app_pid=$!
          trap 'kill "$app_pid" 2>/dev/null || true' EXIT
          sleep 20
          if ! kill -0 "$app_pid"; then
            cat "$RUNNER_TEMP/smoke/app.log"
            log show --style compact --last 2m --predicate 'process == "amfid" OR process == "taskgated-helper" OR process == "CrispChess"' > "$RUNNER_TEMP/smoke/launch-diagnostics.txt" || true
            exit 1
          fi
          cat > "$RUNNER_TEMP/check-desktop.swift" <<'SWIFT'
          import AppKit
          import Foundation
          let pid = pid_t(Int32(CommandLine.arguments[1])!)
          guard let app = NSRunningApplication(processIdentifier: pid),
                app.localizedName == "CrispChess",
                app.bundleIdentifier == "com.crispstrobe.crispchess",
                app.isFinishedLaunching else {
            fatalError("Desktop app did not finish launching with the expected identity")
          }
          print("Running app: \(app.localizedName!), bundle ID: \(app.bundleIdentifier!)")
          SWIFT
          swift "$RUNNER_TEMP/check-desktop.swift" "$app_pid" | tee "$RUNNER_TEMP/smoke/running-app.txt"
          screencapture -x "$RUNNER_TEMP/smoke/macos-desktop.png"
      - name: Replace the release asset and verify its bytes
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/CrispChess-macos.tar.gz"
          tar -czf "$archive" -C "$RUNNER_TEMP/desktop" CrispChess.app
          shasum -a 256 "$archive" | tee "$RUNNER_TEMP/smoke/archive.sha256"
          gh release upload v2.3.1 "$archive" --clobber
          gh release download v2.3.1 -p CrispChess-macos.tar.gz -D "$RUNNER_TEMP/retrieved"
          cmp "$archive" "$RUNNER_TEMP/retrieved/CrispChess-macos.tar.gz"
          echo 'Repaired Mac release archive uploaded and verified'
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: macos-desktop-release-smoke
          path: ${{ runner.temp }}/smoke
