# Fails when a tracked file contains a credential (tests/test_no_secrets.py).
# No paths filter on purpose: a token can land in any file, including docs.
# Background: Kaggle tokens and account names leaked into public CrispStrobe repos (2026-09).
name: Secret scan

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref_type != 'tag' && (github.event_name == 'push' || github.event_name == 'pull_request') }}

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
      - name: No credentials in tracked files
        env:
          # Only used to assert the account name is NOT in the repo.
          KAGGLE_ACCOUNT: ${{ secrets.KAGGLE_ACCOUNT }}
        run: python3 tests/test_no_secrets.py -v
