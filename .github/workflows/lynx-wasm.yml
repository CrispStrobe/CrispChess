# Rebuild the Lynx WASM bundle.
#
# This is a .NET AOT build: it peaked around 950 MB locally and took a shared
# 7.7 GB box to the OOM cliff, which is why it does not belong on a dev
# machine. A GitHub runner has 16 GB and four cores and does it in minutes.
#
# Manual by design — it produces a committed binary artifact, so running it
# should be a decision rather than a side effect of pushing.
name: Lynx WASM bundle

on:
  workflow_dispatch:
    inputs:
      lynx_ref:
        description: "Branch or tag of CrispStrobe/lynx-chess to build"
        default: wasm-browser
        type: string
      apply_patch:
        description: "Apply tool/patches/lynx-wasm-time-control.patch"
        default: true
        type: boolean
      variant:
        description: "Which bundle to build"
        default: both
        type: choice
        options: [both, aot, lite]
      open_pr:
        description: "Push a branch with the rebuilt bundle (otherwise artifact only)"
        default: true
        type: boolean

permissions:
  contents: write
  pull-requests: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      # AOT silently falls back to a non-AOT build when this workload is
      # missing, so a bundle can look fine and be slow.
      - name: Install wasm-tools
        run: dotnet workload install wasm-tools --skip-sign-check

      - name: Clone Lynx (${{ inputs.lynx_ref }})
        run: |
          rm -rf third_party/lynx-chess
          git clone --depth 1 --branch "${{ inputs.lynx_ref }}" \
            https://github.com/CrispStrobe/lynx-chess.git third_party/lynx-chess

      - name: Apply the time-control patch
        if: ${{ inputs.apply_patch }}
        run: |
          cd third_party/lynx-chess
          git apply --verbose ../../tool/patches/lynx-wasm-time-control.patch

      # Two bundles from the same source, because they are a real trade rather
      # than a right answer: AOT is 10-15x faster and 6.1MB gzipped, the
      # interpreter build is 2.3MB and slow. Which one a player wants depends
      # on their connection, so the app offers both and this builds both.
      - name: Build (AOT)
        if: ${{ inputs.variant == 'both' || inputs.variant == 'aot' }}
        run: bash scripts/build_lynx_wasm.sh

      - name: Build (interpreter)
        if: ${{ inputs.variant == 'both' || inputs.variant == 'lite' }}
        run: |
          set -e
          LYNX_OUTPUT_DIR=web/lynx-lite \
            bash scripts/build_lynx_wasm.sh -p:RunAOTCompilation=false
          native_mb=$(( $(stat -c%s web/lynx-lite/_framework/dotnet.native.wasm) / 1024 / 1024 ))
          echo "lite dotnet.native.wasm: ${native_mb} MB"
          if [ "$native_mb" -ge 8 ]; then
            echo "::error::the lite bundle is ${native_mb} MB — AOT ran when it should not have"
            exit 1
          fi
          echo "lite bundle: $(du -sh web/lynx-lite | cut -f1)"

      # A non-AOT bundle builds and runs perfectly well — it is just slow — so
      # the size of the native wasm is the check that matters. AOT bakes the
      # compiled assemblies into it: ~16 MB here against ~1.5 MB without. That
      # is not hypothetical, it is how a local "AOT rebuild" of this bundle
      # turned out to be nothing of the sort, because the wasm-tools workload
      # was still installing and the SDK fell back without saying so.
      - name: Check the bundle looks sane
        if: ${{ inputs.variant == 'both' || inputs.variant == 'aot' }}
        run: |
          set -e
          fw=web/lynx/_framework
          for f in dotnet.js dotnet.native.wasm Lynx.wasm; do
            test -s "$fw/$f" || { echo "missing or empty: $fw/$f"; exit 1; }
          done

          native_mb=$(( $(stat -c%s "$fw/dotnet.native.wasm") / 1024 / 1024 ))
          echo "dotnet.native.wasm: ${native_mb} MB"
          if [ "$native_mb" -lt 8 ]; then
            echo "::error::dotnet.native.wasm is ${native_mb} MB — AOT did not run."
            echo "An AOT bundle is ~16 MB; ~1.5 MB means the SDK fell back to the"
            echo "interpreter, which builds and runs but is far slower."
            exit 1
          fi
          echo "bundle: $(du -sh web/lynx | cut -f1), $(find web/lynx -type f | wc -l) files"

      # Drives the real engine through the repo's own UCI adapter: uciok,
      # readyok, and a legal-looking bestmove from a non-opening position.
      - name: Smoke-test the engine
        if: ${{ inputs.variant == 'both' || inputs.variant == 'aot' }}
        run: |
          set -e
          out=$(printf 'uci\nisready\nposition startpos moves e2e4 c7c5 g1f3\ngo movetime 500\n' \
            | node tool/uci/lynx_wasm_uci.mjs 2>/dev/null)
          echo "$out" | grep -q uciok   || { echo "no uciok";   echo "$out"; exit 1; }
          echo "$out" | grep -q readyok || { echo "no readyok"; echo "$out"; exit 1; }
          echo "$out" | grep -Eq '^bestmove [a-h][1-8][a-h][1-8]' \
            || { echo "no bestmove"; echo "$out"; exit 1; }
          echo "$out" | grep '^bestmove'

      - uses: actions/upload-artifact@v4
        with:
          name: lynx-wasm-bundle
          path: |
            web/lynx/
            web/lynx-lite/
          retention-days: 30

      # Pushes a branch rather than opening a PR: creating PRs from Actions
      # needs "Allow GitHub Actions to create and approve pull requests" turned
      # on for the repo, and a build job should not depend on a setting it
      # cannot see. The compare link in the summary is one click from a PR.
      - name: Push the rebuilt bundle to a branch
        if: ${{ inputs.open_pr }}
        run: |
          set -e
          if git diff --quiet -- web/lynx web/lynx-lite && [ -z "$(git status --porcelain web/lynx-lite)" ]; then
            echo "### Lynx WASM bundle: no change" >> "$GITHUB_STEP_SUMMARY"
            echo "The rebuilt bundle is byte-identical to the committed one." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          branch=lynx-wasm-rebuild
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -B "$branch"
          git add -A web/lynx web/lynx-lite
          git commit -m "chore(lynx): rebuild the WASM bundle

          Lynx ref: ${{ inputs.lynx_ref }}
          Time-control patch applied: ${{ inputs.apply_patch }}
          Built with .NET 10 + wasm-tools; AOT verified by native wasm size."
          git push -f origin "$branch"

          repo="${{ github.server_url }}/${{ github.repository }}"
          {
            echo "### Lynx WASM bundle rebuilt"
            echo
            echo "- Lynx ref: \`${{ inputs.lynx_ref }}\`"
            echo "- Time-control patch: \`${{ inputs.apply_patch }}\`"
            echo
            echo "[Open a PR from \`$branch\`]($repo/compare/main...$branch?expand=1)"
            echo
            echo "The bundle is a binary artifact — check the size change before merging."
          } >> "$GITHUB_STEP_SUMMARY"
