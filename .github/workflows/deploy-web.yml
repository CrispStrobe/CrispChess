name: Deploy Web

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-web
  cancel-in-progress: true

jobs:
  build-and-deploy:
    name: Build & Deploy to Vercel
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # 1. Build Frozenight Rust → WASM
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: native/frozenight-wasm
          shared-key: frozenight-wasm-v2
      - name: Install wasm-pack
        run: curl https://rustwasm.github.io/wasm-pack/installer/init.sh -sSf | sh
      - name: Clean and Build Frozenight WASM
        run: |
          cargo clean
          wasm-pack build --target web --release
        working-directory: native/frozenight-wasm
        continue-on-error: true
      - name: Copy Frozenight WASM to web/
        run: |
          if [ -f native/frozenight-wasm/pkg/frozenight_wasm.js ]; then
            cp native/frozenight-wasm/pkg/frozenight_wasm.js web/
            cp native/frozenight-wasm/pkg/frozenight_wasm_bg.wasm web/
            echo "Frozenight WASM bundled"
          else
            echo "Frozenight WASM not available — skipping"
          fi

      # 2. Build Flutter web (WASM Dart)
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Try WASM build
        id: wasm
        run: flutter build web --release --wasm
        continue-on-error: true

      - name: Fallback to JS build
        if: steps.wasm.outcome == 'failure'
        run: flutter build web --release

      - name: Log build type
        run: |
          if [ -f "build/web/main.dart.wasm" ]; then
            echo "Flutter: WASM"
          else
            echo "Flutter: JS"
          fi
          if [ -f "web/frozenight_wasm.js" ]; then
            echo "Frozenight: WASM bundled"
          else
            echo "Frozenight: not bundled"
          fi

      # 3. Copy Frozenight WASM into build output
      - name: Bundle Frozenight WASM with web build
        run: |
          if [ -f web/frozenight_wasm.js ]; then
            cp web/frozenight_wasm.js build/web/
            cp web/frozenight_wasm_bg.wasm build/web/
          fi

      # 4. Deploy to Vercel
      - name: Prepare deploy
        run: |
          cp vercel.json build/web/vercel.json
          mkdir -p build/web/.vercel
          echo '{"orgId":"${{ secrets.VERCEL_ORG_ID }}","projectId":"${{ secrets.VERCEL_PROJECT_ID }}"}' > build/web/.vercel/project.json

      - name: Install Vercel CLI
        run: npm i -g vercel@latest

      - name: Deploy to Vercel
        if: github.ref == 'refs/heads/main'
        run: vercel deploy --prod --yes --token="${{ secrets.VERCEL_TOKEN }}"
        working-directory: build/web
