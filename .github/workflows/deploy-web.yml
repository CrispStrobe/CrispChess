name: Deploy Web

on:
  push:
    branches: [main]
    # Only redeploy when something that affects the web build changes. Docs,
    # tests, CI config and the non-web platform dirs don't — skipping them
    # avoids burning Vercel's free-tier daily deploy quota (100/day).
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - 'test/**'
      - 'integration_test/**'
      - 'test_driver/**'
      - 'android/**'
      - 'ios/**'
      - 'macos/**'
      - 'windows/**'
      - 'linux/**'
      - '.appstoreconnect/**'
      - '.github/**'
  workflow_dispatch:

concurrency:
  group: deploy-web
  cancel-in-progress: true

jobs:
  build-and-deploy:
    name: Build & Deploy to Vercel
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # 1. Build Frozenight Rust → WASM
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: native/frozenight-wasm
          shared-key: frozenight-wasm-v2
      - name: Install wasm-pack
        run: curl https://rustwasm.github.io/wasm-pack/installer/init.sh -sSf | sh
      - name: Clean and Build Frozenight WASM
        run: |
          cargo clean
          wasm-pack build --target web --release
        working-directory: native/frozenight-wasm
        continue-on-error: true
      - name: Copy Frozenight WASM to web/
        run: |
          if [ -f native/frozenight-wasm/pkg/frozenight_wasm.js ]; then
            cp native/frozenight-wasm/pkg/frozenight_wasm.js web/
            cp native/frozenight-wasm/pkg/frozenight_wasm_bg.wasm web/
            echo "Frozenight WASM bundled"
          else
            echo "Frozenight WASM not available — skipping"
          fi

      # 2. Build Flutter web (WASM Dart)
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Get dependencies
        run: flutter pub get

      - name: Generate localizations
        run: dart run intl_utils:generate || flutter gen-l10n || true

      # The Lc0 engine's runtime was fetched from a public CDN on every cold
      # load. That is a third party between a user and the engine starting, and
      # when it is blocked or down the engine fails before it can say anything
      # useful. Serving it from here removes that. The bridge probes for these
      # and falls back to the CDN when they are absent, so a checkout without
      # them still runs.
      #
      # The wasm-only build, not the JSEP one: WebGPU needs cross-origin
      # isolation, this is not served with it, and the difference is 12MB
      # against 23MB of binary that could never be used.
      - name: Vendor the ONNX Runtime binary
        run: |
          version=1.21.0
          base="https://cdn.jsdelivr.net/npm/onnxruntime-web@$version/dist"
          mkdir -p web/ort
          for f in ort-wasm-simd-threaded.mjs ort-wasm-simd-threaded.wasm; do
            curl -sSLf --retry 3 -o "web/ort/$f" "$base/$f"
          done
          ls -la web/ort/

      - name: Build Flutter web
        run: |
          # Try WASM first, fall back to JS
          if flutter build web --release --wasm \
            --dart-define=GIT_HASH=$(git rev-parse --short HEAD) \
            --dart-define=BUILD_DATE=$(date -u +%Y-%m-%d); then
            echo "WASM build succeeded"
          else
            echo "WASM failed, trying JS build..."
            flutter build web --release \
              --dart-define=GIT_HASH=$(git rev-parse --short HEAD) \
              --dart-define=BUILD_DATE=$(date -u +%Y-%m-%d)
          fi

      - name: Log build type
        run: |
          if [ -f "build/web/main.dart.wasm" ]; then
            echo "Flutter: WASM"
          else
            echo "Flutter: JS"
          fi
          if [ -f "web/frozenight_wasm.js" ]; then
            echo "Frozenight: WASM bundled"
          else
            echo "Frozenight: not bundled"
          fi

      # 3. Copy Frozenight WASM into build output
      - name: Bundle Frozenight WASM with web build
        run: |
          if [ -f web/frozenight_wasm.js ]; then
            cp web/frozenight_wasm.js build/web/
            cp web/frozenight_wasm_bg.wasm build/web/
          fi

      # 4. Optimize build output
      - name: Remove source maps and optimize
        run: |
          # Remove ONNX Runtime source map (1.3 MB, debugging only)
          rm -f build/web/ort.min.js.map
          # Remove any other .map files from build
          find build/web -name '*.map' -size +100k -delete
          echo "Build size: $(du -sh build/web | cut -f1)"

      # 5. Deploy to Vercel
      - name: Prepare deploy
        run: |
          cp vercel.json build/web/vercel.json
          mkdir -p build/web/.vercel
          echo '{"orgId":"${{ secrets.VERCEL_ORG_ID }}","projectId":"${{ secrets.VERCEL_PROJECT_ID }}"}' > build/web/.vercel/project.json

      # A second home for the same build, on GitHub Pages.
      #
      # Vercel's free tier allows 100 deployments a day across every project on
      # the account, and v2.2.0 hit it: the build succeeded, all 7.2MB
      # uploaded, and the deploy was refused. Pages has no such cap, costs
      # nothing, and is already serving this repo — so far only `docs/`, whose
      # root 404s because there is no index.html in it.
      #
      # docs/ is copied in alongside the app so nothing that was reachable
      # stops being reachable: /privacy.html keeps working, and / becomes the
      # app instead of a 404.
      - name: Publish to GitHub Pages
        if: ${{ !cancelled() }}
        run: |
          set -e
          # `Prepare deploy` writes .vercel/project.json into this directory
          # from VERCEL_ORG_ID and VERCEL_PROJECT_ID, which are repository
          # secrets. gh-pages is public. They are identifiers rather than
          # credentials, but secrets do not get published because they looked
          # harmless — take them out explicitly rather than relying on this
          # step running before that one.
          rm -rf build/web/.vercel build/web/vercel.json
          if [ -d docs ]; then cp -r docs/. build/web/; fi
          touch build/web/.nojekyll   # or Flutter's _-prefixed assets vanish
          cd build/web
          git init -q
          git config user.name "crispasr integration"
          git config user.email "stc.akrs@gmail.com"
          git add -A
          git commit -q -m "Deploy ${GITHUB_SHA::7} to Pages"
          git push -q --force \
            "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" \
            HEAD:gh-pages
          echo "pushed $(find . -type f | wc -l) files to gh-pages"

      - name: Install Vercel CLI
        run: npm i -g vercel@latest

      - name: Deploy to Vercel
        if: github.ref == 'refs/heads/main'
        run: vercel deploy --prod --yes --token="${{ secrets.VERCEL_TOKEN }}"
        working-directory: build/web
