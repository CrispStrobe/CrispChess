name: Deploy Web

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-web
  cancel-in-progress: true

jobs:
  build-and-deploy:
    name: Build & Deploy to Vercel
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Try WASM build
        id: wasm
        run: flutter build web --release --wasm
        continue-on-error: true

      - name: Fallback to JS build
        if: steps.wasm.outcome == 'failure'
        run: flutter build web --release

      - name: Log build type
        run: |
          if [ -f "build/web/main.dart.wasm" ]; then
            echo "BUILD_TYPE=wasm" >> $GITHUB_ENV
            echo "Built with WASM"
          else
            echo "BUILD_TYPE=js" >> $GITHUB_ENV
            echo "Built with JS"
          fi

      - name: Prepare deploy
        run: |
          cp vercel.json build/web/vercel.json
          mkdir -p build/web/.vercel
          echo '{"orgId":"${{ secrets.VERCEL_ORG_ID }}","projectId":"${{ secrets.VERCEL_PROJECT_ID }}"}' > build/web/.vercel/project.json

      - name: Install Vercel CLI
        run: npm i -g vercel@latest

      - name: Deploy to Vercel
        if: github.ref == 'refs/heads/main'
        run: vercel deploy --prod --yes --token="${{ secrets.VERCEL_TOKEN }}"
        working-directory: build/web
