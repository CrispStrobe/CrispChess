name: App Store preparation

on:
  workflow_dispatch:
    inputs:
      action:
        type: choice
        options: [audit, diagnose, listing, listing-ios, listing-mac, store, beta, mac, submit-dry-run, submit]
        default: audit
      build:
        description: 'CFBundleVersion for store / submit (e.g. 16)'
        type: string
        default: ''
      platform:
        description: 'Platform for store / submit'
        type: choice
        options: [IOS, MAC_OS]
        default: IOS

permissions:
  contents: read

jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: python3 -m pip install --quiet --disable-pip-version-check cryptography
      - name: Audit or prepare App Store Connect
        env:
          ASC_API_KEY_P8_BASE64: ${{ secrets.ASC_API_KEY_P8_BASE64 }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ACTION: ${{ inputs.action }}
          BUILD: ${{ inputs.build }}
          PLATFORM: ${{ inputs.platform }}
        run: |
          case "$ACTION" in
            audit) python3 tools/asc/audit.py ;;
            diagnose) python3 tools/asc/diagnose.py ;;
            listing) python3 tools/asc/listing.py ;;
            listing-ios) python3 tools/asc/listing.py --platform IOS ;;
            listing-mac) python3 tools/asc/listing.py --platform MAC_OS ;;
            store) python3 tools/asc/store.py ${BUILD:+--build "$BUILD"} --platform "$PLATFORM" ;;
            submit-dry-run) python3 tools/asc/submit.py --build "$BUILD" --platform "$PLATFORM" --dry-run ;;
            submit) python3 tools/asc/submit.py --build "$BUILD" --platform "$PLATFORM" ;;
            beta) python3 tools/asc/beta.py ;;
            mac) python3 tools/asc/mac.py && python3 tools/asc/listing.py ;;
          esac
