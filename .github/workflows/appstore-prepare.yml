name: App Store preparation

on:
  workflow_dispatch:
    inputs:
      action:
        type: choice
        options: [audit, diagnose, listing, listing-ios, listing-mac, store, beta, mac, review-notes, resubmit-mac, submit-dry-run, submit]
        default: audit
      build:
        description: 'CFBundleVersion for store / submit (e.g. 16)'
        type: string
        default: ''
      platform:
        description: 'Platform for store / submit'
        type: choice
        options: [IOS, MAC_OS]
        default: IOS
      review_note:
        description: Explanation to append to App Review notes for the selected build
        type: string
        default: ''

permissions:
  contents: read

jobs:
  prepare:
    if: github.actor == 'CrispStrobe' && github.event_name == 'workflow_dispatch'
    runs-on: crispchess-asc-20261026-4c2a
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Prepare isolated Python environment
        run: |
          python3 -m venv "$RUNNER_TEMP/asc-venv"
          "$RUNNER_TEMP/asc-venv/bin/python3" -m pip install --quiet --disable-pip-version-check cryptography
          printf '%s\n' "$RUNNER_TEMP/asc-venv/bin" >> "$GITHUB_PATH"
      - name: Audit or prepare App Store Connect
        env:
          ASC_API_KEY_P8_BASE64: ${{ secrets.ASC_API_KEY_P8_BASE64 }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ACTION: ${{ inputs.action }}
          BUILD: ${{ inputs.build }}
          PLATFORM: ${{ inputs.platform }}
          REVIEW_NOTE: ${{ inputs.review_note }}
        run: |
          case "$ACTION" in
            audit) python3 tools/asc/audit.py ;;
            diagnose) python3 tools/asc/diagnose.py ;;
            listing) python3 tools/asc/listing.py ;;
            listing-ios) python3 tools/asc/listing.py --platform IOS ;;
            listing-mac) python3 tools/asc/listing.py --platform MAC_OS ;;
            store) python3 tools/asc/store.py ${BUILD:+--build "$BUILD"} --platform "$PLATFORM" ;;
            review-notes)
              printf '%s\n' "$REVIEW_NOTE" > "$RUNNER_TEMP/review-note.txt"
              python3 tools/asc/review_notes.py --build "$BUILD" --platform "$PLATFORM" --notes-file "$RUNNER_TEMP/review-note.txt"
              ;;
            resubmit-mac)
              set -euo pipefail
              [ "$PLATFORM" = MAC_OS ]
              [ -n "$BUILD" ]
              [ -n "$REVIEW_NOTE" ]
              python3 tools/asc/store.py --build "$BUILD" --platform MAC_OS --attach-only
              printf '%s\n' "$REVIEW_NOTE" > "$RUNNER_TEMP/review-note.txt"
              python3 tools/asc/review_notes.py --build "$BUILD" --platform MAC_OS --notes-file "$RUNNER_TEMP/review-note.txt"
              python3 tools/asc/submit.py --build "$BUILD" --platform MAC_OS --dry-run
              python3 tools/asc/submit.py --build "$BUILD" --platform MAC_OS
              python3 tools/asc/audit.py
              ;;
            submit-dry-run) python3 tools/asc/submit.py --build "$BUILD" --platform "$PLATFORM" --dry-run ;;
            submit) python3 tools/asc/submit.py --build "$BUILD" --platform "$PLATFORM" ;;
            beta) python3 tools/asc/beta.py ;;
            mac) python3 tools/asc/mac.py && python3 tools/asc/listing.py ;;
          esac
