name: Release artifact validation

on:
  workflow_dispatch:
    inputs:
      upload_mac:
        description: Upload the original signed package after the Mac smoke test passes
        type: boolean
        default: false
      mac_runner:
        description: Apple Silicon runner image for the signed package check
        type: choice
        options: [macos-15, macos-15-intel, macos-latest]
        default: macos-15
      mac_only:
        description: Run only the Mac check when other artifact checks are already collected
        type: boolean
        default: false
      submit_mac:
        description: Attach build 17 and resubmit after processing and CI pass
        type: boolean
        default: false
      review_note:
        description: Explanation to append to App Review notes
        type: string
        default: ''
      upload_only:
        description: Reuse passed native checks after verifying the package checksum matches
        type: boolean
        default: false

permissions:
  contents: read
  actions: read

env:
  GH_TOKEN: ${{ github.token }}
  GH_REPO: ${{ github.repository }}
  RELEASE_RUN: '40375540711'
  MAC_RUN: '40375557251'
  RELEASE_SHA: c43ebdaee8eee38a8c455d026be72c2c6aac3d57

jobs:
  macos:
    runs-on: ${{ inputs.mac_runner }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
      - name: Download the original signed package
        run: |
          set -euo pipefail
          [ "$(gh api "repos/$GH_REPO/actions/runs/$MAC_RUN" --jq .head_sha)" = "$RELEASE_SHA" ]
          for attempt in $(seq 1 60); do
            if gh run download "$MAC_RUN" -n crispchess-macos-appstore-pkg -D package; then exit 0; fi
            sleep 30
          done
          exit 1
      - name: Install and validate the signed app
        if: ${{ !inputs.upload_only }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/smoke"
          package="$PWD/package/CrispChess-2.3.1-17.pkg"
          shasum -a 256 "$package" | tee "$RUNNER_TEMP/smoke/package.sha256"
          pkgutil --check-signature "$package" | tee "$RUNNER_TEMP/smoke/package-signature.txt"
          sudo installer -pkg "$package" -target /
          python3 tools/verify_macos_app.py /Applications/CrispChess.app
          codesign --verify --deep --strict --verbose=2 /Applications/CrispChess.app
          codesign --display --verbose=4 /Applications/CrispChess.app 2> "$RUNNER_TEMP/smoke/app-signature.txt"
          nm -gU /Applications/CrispChess.app/Contents/Frameworks/crispasr.framework/crispasr | grep crispasr_session_score_texts
      - name: Prepare a local-test signature for the App Store payload
        if: ${{ !inputs.upload_only }}
        run: |
          set -euo pipefail
          # App Store distribution signatures cannot launch directly (Apple QA1884).
          # Re-sign a copy for the local smoke test; upload the original package.
          app="$RUNNER_TEMP/launch/CrispChess.app"
          mkdir -p "$(dirname "$app")"
          ditto /Applications/CrispChess.app "$app"
          codesign --display --entitlements :- "$app" > "$RUNNER_TEMP/smoke/test-entitlements.plist"
          /usr/libexec/PlistBuddy -c 'Delete :com.apple.application-identifier' "$RUNNER_TEMP/smoke/test-entitlements.plist"
          /usr/libexec/PlistBuddy -c 'Delete :com.apple.developer.team-identifier' "$RUNNER_TEMP/smoke/test-entitlements.plist"
          rm "$app/Contents/embedded.provisionprofile"
          find "$app/Contents/Frameworks" -type f \( -name '*.dylib' -o -perm -111 \) -print0 | while IFS= read -r -d '' item; do
            codesign --force --options runtime --sign - "$item"
          done
          find "$app/Contents/Frameworks" -depth -type d -name '*.framework' -print0 | while IFS= read -r -d '' framework; do
            codesign --force --options runtime --sign - "$framework"
          done
          codesign --force --options runtime --entitlements "$RUNNER_TEMP/smoke/test-entitlements.plist" --sign - "$app"
          codesign --verify --deep --strict "$app"
          python3 tools/verify_macos_app.py "$app"
      - name: Launch the Mac payload and capture its display name
        if: ${{ !inputs.upload_only }}
        run: |
          set -euo pipefail
          "$RUNNER_TEMP/launch/CrispChess.app/Contents/MacOS/CrispChess" > "$RUNNER_TEMP/smoke/app.log" 2>&1 &
          app_pid=$!
          trap 'kill "$app_pid" 2>/dev/null || true' EXIT
          sleep 20
          if ! kill -0 "$app_pid"; then
            cat "$RUNNER_TEMP/smoke/app.log"
            log show --style compact --last 2m --predicate 'process == "amfid" OR process == "taskgated-helper" OR process == "CrispChess"' > "$RUNNER_TEMP/smoke/launch-diagnostics.txt" || true
            exit 1
          fi
          cat > "$RUNNER_TEMP/check-app.swift" <<'SWIFT'
          import AppKit
          import Foundation
          let pid = pid_t(Int32(CommandLine.arguments[1])!)
          guard let app = NSRunningApplication(processIdentifier: pid),
                app.localizedName == "CrispChess",
                app.bundleIdentifier == "com.crispstrobe.crispchess",
                app.isFinishedLaunching else {
            fatalError("Installed app did not finish launching with the expected identity")
          }
          print("Running app: \(app.localizedName!), bundle ID: \(app.bundleIdentifier!)")
          SWIFT
          swift "$RUNNER_TEMP/check-app.swift" "$app_pid" | tee "$RUNNER_TEMP/smoke/running-app.txt"
          screencapture -x "$RUNNER_TEMP/smoke/macos.png"
      - name: Verify prior native checks of the identical signed package
        if: inputs.upload_only
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/smoke" "$RUNNER_TEMP/proof"
          gh run download 40383983442 -n macos-installed-app-smoke -D "$RUNNER_TEMP/proof"
          gh api "repos/$GH_REPO/actions/runs/40383983442/jobs" > "$RUNNER_TEMP/proof/jobs.json"
          python3 - "$RUNNER_TEMP/proof" "$PWD/package/CrispChess-2.3.1-17.pkg" <<'PY'
          import hashlib, json, pathlib, sys
          proof = pathlib.Path(sys.argv[1])
          package = pathlib.Path(sys.argv[2])
          jobs = json.loads((proof / 'jobs.json').read_text())['jobs']
          steps = [step for job in jobs for step in job.get('steps', [])]
          for name in ('Install and validate the signed app', 'Launch the Mac payload and capture its display name'):
              assert any(step['name'] == name and step['conclusion'] == 'success' for step in steps), name
          expected = (proof / 'package.sha256').read_text().split()[0]
          actual = hashlib.sha256(package.read_bytes()).hexdigest()
          assert expected == actual, 'Package differs from the one that passed native checks'
          assert 'Running app: CrispChess, bundle ID: com.crispstrobe.crispchess' in (proof / 'running-app.txt').read_text()
          print('Native Apple Silicon checks passed for the identical signed package:', actual)
          PY
          shasum -a 256 "$PWD/package/CrispChess-2.3.1-17.pkg" > "$RUNNER_TEMP/smoke/package.sha256"
      - name: Upload the validated package to App Store Connect
        if: inputs.upload_mac
        env:
          ASC_API_KEY_P8_BASE64: ${{ secrets.ASC_API_KEY_P8_BASE64 }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
        run: |
          set -euo pipefail
          key="$HOME/.appstoreconnect/private_keys/AuthKey_${ASC_KEY_ID}.p8"
          mkdir -p "$(dirname "$key")"
          trap 'rm -f "$key"' EXIT
          echo "$ASC_API_KEY_P8_BASE64" | base64 --decode > "$key"
          chmod 600 "$key"
          shasum -a 256 -c "$RUNNER_TEMP/smoke/package.sha256"
          xcrun altool --upload-package "$PWD/package/CrispChess-2.3.1-17.pkg" --type macos --apple-id 6788864039 --bundle-id com.crispstrobe.crispchess --bundle-version 17 --bundle-short-version-string 2.3.1 --apiKey "$ASC_KEY_ID" --apiIssuer "$ASC_ISSUER_ID"
      - name: Attach the processed build and resubmit macOS
        if: inputs.submit_mac && inputs.upload_mac
        env:
          ASC_API_KEY_P8_BASE64: ${{ secrets.ASC_API_KEY_P8_BASE64 }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          REVIEW_NOTE: ${{ inputs.review_note }}
        run: |
          set -euo pipefail
          [ -n "$REVIEW_NOTE" ]
          python3 -m venv "$RUNNER_TEMP/asc"
          "$RUNNER_TEMP/asc/bin/pip" install --quiet cryptography
          "$RUNNER_TEMP/asc/bin/python" - <<'PY'
          import json, os, pathlib, subprocess, sys, time
          sys.path.insert(0, str(pathlib.Path('tools/asc').resolve()))
          import client
          app = json.loads(pathlib.Path('tools/asc/metadata.json').read_text())['appId']
          for attempt in range(60):
              ci = json.loads(subprocess.check_output(['gh', 'run', 'view', '40375539723', '--json', 'headSha,status,conclusion'], text=True))
              assert ci['headSha'] == os.environ['RELEASE_SHA']
              if ci['status'] == 'completed' and ci['conclusion'] != 'success':
                  raise SystemExit('Required CI checks did not pass: ' + ci['conclusion'])
              valid = []
              for build in client.paged(f'/v1/apps/{app}/builds?limit=200'):
                  if build['attributes'].get('version') != '17':
                      continue
                  release = client.expect('GET', f"/v1/builds/{build['id']}/preReleaseVersion")['data']
                  if release['attributes'].get('platform') != 'MAC_OS':
                      continue
                  assert release['attributes']['version'] == '2.3.1'
                  state = build['attributes'].get('processingState')
                  if state in ('FAILED', 'INVALID'):
                      raise SystemExit('macOS build 17 failed App Store processing: ' + state)
                  if state == 'VALID':
                      valid.append(build)
              if len(valid) > 1:
                  raise SystemExit('More than one valid macOS build 17; refusing an ambiguous submission')
              if len(valid) == 1 and ci['status'] == 'completed':
                  print('macOS 2.3.1 (17) processed successfully; required CI checks passed')
                  break
              print(f'Waiting for macOS build processing and CI: valid builds={len(valid)}, CI={ci["status"]}', flush=True)
              time.sleep(20)
          else:
              raise SystemExit('Timed out waiting for macOS processing and CI')
          PY
          python="$RUNNER_TEMP/asc/bin/python"
          "$python" tools/asc/store.py --build 17 --platform MAC_OS
          printf '%s\n' "$REVIEW_NOTE" > "$RUNNER_TEMP/review-note.txt"
          "$python" tools/asc/review_notes.py --build 17 --platform MAC_OS --notes-file "$RUNNER_TEMP/review-note.txt"
          "$python" tools/asc/submit.py --build 17 --platform MAC_OS --dry-run
          "$python" tools/asc/submit.py --build 17 --platform MAC_OS
          "$python" tools/asc/audit.py
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: macos-installed-app-smoke
          path: ${{ runner.temp }}/smoke

  windows:
    if: ${{ !inputs.mac_only }}
    runs-on: windows-latest
    timeout-minutes: 40
    steps:
      - name: Download the Windows release
        shell: bash
        run: |
          set -euo pipefail
          [ "$(gh api "repos/$GH_REPO/actions/runs/$RELEASE_RUN" --jq .head_sha)" = "$RELEASE_SHA" ]
          for attempt in $(seq 1 60); do
            if gh run download "$RELEASE_RUN" -n windows-x64 -D package; then exit 0; fi
            sleep 30
          done
          exit 1
      - name: Launch the packaged app
        shell: pwsh
        run: |
          Expand-Archive package/CrispChess-windows-x64.zip app
          New-Item -ItemType Directory -Force smoke
          if (!(Test-Path app/crispasr.dll)) { throw 'Speech library missing' }
          $root = (Resolve-Path app).Path
          $process = Start-Process -FilePath "$root/crispchess.exe" -WorkingDirectory $root -PassThru -RedirectStandardOutput smoke/stdout.log -RedirectStandardError smoke/stderr.log
          try {
            Start-Sleep -Seconds 20
            $process.Refresh()
            if ($process.HasExited) { throw "App exited with code $($process.ExitCode)" }
            if ($process.MainWindowTitle -ne 'CrispChess') { throw "Unexpected window title: $($process.MainWindowTitle)" }
            "Running app: $($process.ProcessName), window: $($process.MainWindowTitle)" | Tee-Object smoke/running-app.txt
            Add-Type -AssemblyName System.Windows.Forms
            Add-Type -AssemblyName System.Drawing
            $bounds = [System.Windows.Forms.Screen]::PrimaryScreen.Bounds
            $bitmap = New-Object System.Drawing.Bitmap($bounds.Width, $bounds.Height)
            $graphics = [System.Drawing.Graphics]::FromImage($bitmap)
            $graphics.CopyFromScreen($bounds.Location, [System.Drawing.Point]::Empty, $bounds.Size)
            $bitmap.Save("$PWD/smoke/windows.png", [System.Drawing.Imaging.ImageFormat]::Png)
            $graphics.Dispose()
            $bitmap.Dispose()
          } finally {
            if (!$process.HasExited) { Stop-Process -Id $process.Id }
          }
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: windows-app-smoke
          path: smoke

  linux:
    if: ${{ !inputs.mac_only }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        artifact: [linux-x64, linux-x64-frozenight]
    steps:
      - name: Install runtime and screenshot dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-0t64 libgl1 libegl1 libasound2t64 libsecret-1-0 xvfb x11-utils imagemagick
      - name: Download the Linux release
        env:
          ARTIFACT: ${{ matrix.artifact }}
        run: |
          set -euo pipefail
          [ "$(gh api "repos/$GH_REPO/actions/runs/$RELEASE_RUN" --jq .head_sha)" = "$RELEASE_SHA" ]
          for attempt in $(seq 1 60); do
            if gh run download "$RELEASE_RUN" -n "$ARTIFACT" -D package; then exit 0; fi
            sleep 30
          done
          exit 1
      - name: Launch the packaged app on a virtual display
        env:
          ARTIFACT: ${{ matrix.artifact }}
          LIBGL_ALWAYS_SOFTWARE: '1'
          GDK_BACKEND: x11
        run: |
          set -euo pipefail
          mkdir -p app smoke
          tar -xzf "package/CrispChess-${ARTIFACT}.tar.gz" -C app
          test -f app/lib/libcrispasr.so
          test -f app/lib/libonnxruntime.so
          ldd app/crispchess | tee smoke/dependencies.txt
          ! grep -q 'not found' smoke/dependencies.txt
          dbus-run-session -- xvfb-run -a bash -eu -o pipefail <<'SMOKE'
          cd app
          ./crispchess > ../smoke/app.log 2>&1 &
          app_pid=$!
          trap 'kill "$app_pid" 2>/dev/null || true' EXIT
          sleep 20
          kill -0 "$app_pid"
          xwininfo -root -tree | tee ../smoke/windows.txt
          grep CrispChess ../smoke/windows.txt
          import -window root ../smoke/linux.png
          SMOKE
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: ${{ matrix.artifact }}-app-smoke
          path: smoke

  mobile-and-web:
    if: ${{ !inputs.mac_only }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v6
        with:
          ref: v2.3.1
      - name: Download mobile and web releases
        run: |
          set -euo pipefail
          [ "$(gh api "repos/$GH_REPO/actions/runs/$RELEASE_RUN" --jq .head_sha)" = "$RELEASE_SHA" ]
          for artifact in android-apk ios-unsigned web; do
            available=false
            for attempt in $(seq 1 60); do
              if gh run download "$RELEASE_RUN" -n "$artifact" -D "package/$artifact"; then available=true; break; fi
              sleep 30
            done
            [ "$available" = true ]
          done
      - name: Verify mobile package versions and speech libraries
        run: |
          set -euo pipefail
          apk=package/android-apk/app-release.apk
          analyzer="$ANDROID_HOME/cmdline-tools/latest/bin/apkanalyzer"
          "$analyzer" manifest application-id "$apk"
          [ "$("$analyzer" manifest version-name "$apk")" = 2.3.1 ]
          [ "$("$analyzer" manifest version-code "$apk")" = 17 ]
          python3 - <<'PY'
          from pathlib import Path
          import plistlib, zipfile
          with zipfile.ZipFile('package/ios-unsigned/CrispChess-ios-unsigned.ipa') as ipa:
              names = ipa.namelist()
              path = next(name for name in names if name.startswith('Payload/') and name.count('/') == 2 and name.endswith('/Info.plist'))
              info = plistlib.loads(ipa.read(path))
              assert info['CFBundleIdentifier'] == 'com.crispstrobe.crispchess'
              assert info['CFBundleDisplayName'] == 'CrispChess'
              assert info['CFBundleShortVersionString'] == '2.3.1'
              assert info['CFBundleVersion'] == '17'
              assert any('/crispasr.framework/crispasr' in name for name in names)
              print('iOS identity, version, build, and speech framework verified')
          with zipfile.ZipFile('package/android-apk/app-release.apk') as apk:
              assert 'AndroidManifest.xml' in apk.namelist()
              assert any(name.endswith('/libapp.so') for name in apk.namelist())
              print('Android package and compiled application present')
          PY
      - name: Launch the packaged web app in Chromium
        run: |
          set -euo pipefail
          mkdir -p app smoke
          tar -xzf package/web/CrispChess-web.tar.gz -C app
          python3 -m venv "$RUNNER_TEMP/playwright"
          "$RUNNER_TEMP/playwright/bin/pip" install --quiet playwright
          "$RUNNER_TEMP/playwright/bin/playwright" install --with-deps chromium
          python3 -m http.server 8765 --directory app > smoke/server.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          "$RUNNER_TEMP/playwright/bin/python" - <<'PY'
          from playwright.sync_api import sync_playwright
          with sync_playwright() as playwright:
              browser = playwright.chromium.launch()
              page = browser.new_page(viewport={'width': 1440, 'height': 900})
              errors = []
              page.on('pageerror', lambda error: errors.append(str(error)))
              page.goto('http://127.0.0.1:8765', wait_until='networkidle', timeout=120000)
              page.wait_for_selector('flutter-view', timeout=120000)
              page.wait_for_timeout(15000)
              page.screenshot(path='smoke/web.png')
              assert 'crispchess' in page.title().lower(), page.title()
              assert not errors, errors
              print('Web release renders in Chromium without uncaught JavaScript errors')
              browser.close()
          PY
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: mobile-and-web-package-smoke
          path: smoke
