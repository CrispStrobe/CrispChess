name: crispchess
description: Cross-platform chess app with pluggable engines.
publish_to: "none"

version: 2.1.0+12

environment:
  sdk: ">=3.5.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  intl: any
  chess: ^0.8.1
  crisp_chess_engine: ^0.8.1
  onnx_runtime_dart:
    git:
      url: https://github.com/CrispStrobe/onnx_runtime_dart.git
      ref: d9afbe2
  onnxruntime: ^1.4.1
  ffi: ^2.0.0
  flutter_svg: ^2.2.3
  logging: ^1.2.0
  path_provider: ^2.1.0
  shared_preferences: ^2.3.0
  web: ^1.0.0
  package_info_plus: ^10.2.0
  protobuf: ^6.0.0
  fixnum: ^1.1.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  flutter_launcher_icons: ^0.14.0
  protoc_plugin: ^25.0.0

# Run: dart run flutter_launcher_icons
flutter_launcher_icons:
  android: true
  ios: true
  macos:
    generate: true
  web:
    generate: true
  image_path: "assets/icon/icon.png"
  remove_alpha_ios: true
  adaptive_icon_background: "#7E4A29"
  adaptive_icon_foreground: "assets/icon/icon_foreground.png"

flutter:
  uses-material-design: true
  generate: true
  assets:
    - assets/pieces/chessnut/
    - assets/pieces/rhosgfx/
    - assets/pieces/fantasy/
    - assets/pieces/spatial/
    - assets/pieces/celtic/
    - assets/pieces/kiwen-suwi/
    - assets/pieces/totoy/
    - assets/pieces/papercut/
    - assets/puzzles.json
