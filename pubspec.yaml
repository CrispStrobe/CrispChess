name: crispchess
description: Cross-platform chess app with pluggable engines.
publish_to: "none"

version: 2.0.3+4

environment:
  sdk: ">=3.5.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  intl: any
  chess: ^0.8.1
  crisp_chess_engine: ^0.2.0
  onnx_runtime_dart: ^0.2.0
  ffi: ^2.0.0
  flutter_svg: ^2.2.3
  logging: ^1.2.0
  path_provider: ^2.1.0
  shared_preferences: ^2.3.0
  web: ^1.0.0
  package_info_plus: ^10.2.0
  protobuf: ^6.0.0
  fixnum: ^1.1.1

# Temporary: crisp_chess_engine 0.2.0 fixes a search bug that could return a
# move for the wrong side, and is ~5x faster. 0.2.0 is not on pub.dev yet, so
# resolve it from git; delete this whole block once it is published.
dependency_overrides:
  crisp_chess_engine:
    git:
      url: https://github.com/CrispStrobe/crisp_chess_engine.git
      ref: 7bec1814c4aadae30aaa3978c84704a1422dc52a

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  flutter_launcher_icons: ^0.14.0
  protoc_plugin: ^25.0.0

# Run: dart run flutter_launcher_icons
flutter_launcher_icons:
  android: true
  ios: true
  macos:
    generate: true
  web:
    generate: true
  image_path: "assets/icon/icon.png"
  remove_alpha_ios: true
  adaptive_icon_background: "#7E4A29"
  adaptive_icon_foreground: "assets/icon/icon_foreground.png"

flutter:
  uses-material-design: true
  generate: true
  assets:
    - assets/pieces/chessnut/
    - assets/pieces/rhosgfx/
    - assets/pieces/fantasy/
    - assets/pieces/spatial/
    - assets/pieces/celtic/
    - assets/pieces/kiwen-suwi/
    - assets/pieces/totoy/
    - assets/pieces/papercut/
    - assets/puzzles.json
