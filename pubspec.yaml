name: crispchess
description: Cross-platform chess app with pluggable engines.
publish_to: "none"

version: 1.4.0+1

environment:
  sdk: ">=3.5.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  intl: any
  chess: ^0.8.1
  ffi: ^2.0.0
  flutter_svg: ^2.2.3
  logging: ^1.2.0
  path_provider: ^2.1.0
  shared_preferences: ^2.3.0
  web: ^1.0.0
  onnxruntime: ^1.4.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  flutter_launcher_icons: ^0.14.0

# Run: dart run flutter_launcher_icons
flutter_launcher_icons:
  android: true
  ios: true
  web:
    generate: true
  image_path: "assets/icon/icon.png"
  remove_alpha_ios: true
  adaptive_icon_background: "#1a1a2e"
  adaptive_icon_foreground: "assets/icon/icon_foreground.png"

flutter:
  uses-material-design: true
  generate: true
  assets:
    - assets/pieces/chessnut/
    - assets/pieces/rhosgfx/
    - assets/pieces/fantasy/
    - assets/pieces/spatial/
    - assets/pieces/celtic/
    - assets/pieces/kiwen-suwi/
    - assets/pieces/totoy/
    - assets/pieces/papercut/
    - assets/puzzles.json
