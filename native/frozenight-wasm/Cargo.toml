[package]
name = "frozenight-wasm"
version = "1.0.0"
edition = "2021"

[lib]
crate-type = ["cdylib"]

[dependencies]
frozenight = { git = "https://github.com/CrispStrobe/frozenight", branch = "main" }
cozy-chess = "0.3"
bytemuck = { version = "1", features = ["derive"] }
wasm-bindgen = "0.2"
# Polyfill for std::time::Instant on WASM
web-time = "1"

[profile.release]
lto = true
opt-level = "s"
# Frozenight fork updated: search.rs + threading.rs patched
