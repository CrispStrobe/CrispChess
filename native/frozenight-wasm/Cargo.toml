[package]
name = "frozenight-wasm"
version = "1.0.0"
edition = "2021"

[lib]
crate-type = ["cdylib"]

[dependencies]
frozenight = { git = "https://github.com/MinusKelvin/frozenight", branch = "main" }
cozy-chess = "0.3"
bytemuck = { version = "1", features = ["derive"] }
wasm-bindgen = "0.2"

[profile.release]
lto = true
opt-level = "s"  # Optimize for size (WASM download)
